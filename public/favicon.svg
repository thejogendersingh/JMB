<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C140E"/>
      <stop offset="50%" stop-color="#261B13"/>
      <stop offset="100%" stop-color="#150E09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDB272"/>
      <stop offset="50%" stop-color="#F3DCB1"/>
      <stop offset="100%" stop-color="#B88744"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C99A5B"/>
      <stop offset="50%" stop-color="#E8C68C"/>
      <stop offset="100%" stop-color="#8C6332"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Inner Heritage Border -->
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Haveli Arch & Central Dome Motif -->
  <g fill="url(#goldGrad)" transform="translate(66, 68)">
    <!-- Top Kalash & Finial -->
    <circle cx="190" cy="32" r="10"/>
    <path d="M190 12 L190 22" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M182 38 Q190 28 198 38 L190 48 Z"/>

    <!-- Central Royal Chhatri / Dome -->
    <path d="M110 130 C110 80 150 48 190 48 C230 48 270 80 270 130 Z"/>
    <!-- Dome Base Molding -->
    <rect x="98" y="130" width="184" height="14" rx="4"/>

    <!-- Chhatri Supporting Pillars -->
    <rect x="112" y="144" width="14" height="46" rx="3"/>
    <rect x="144" y="144" width="12" height="46" rx="3"/>
    <rect x="184" y="144" width="12" height="46" rx="3"/>
    <rect x="224" y="144" width="12" height="46" rx="3"/>
    <rect x="254" y="144" width="14" height="46" rx="3"/>

    <!-- Haveli Grand Facade Base -->
    <rect x="50" y="190" width="280" height="16" rx="4"/>

    <!-- Royal Haveli Main Body -->
    <path d="M50 206 L330 206 L330 316 L50 316 Z"/>

    <!-- Left Jharokha (Window) Cutout -->
    <path d="M78 226 Q98 214 118 226 L118 280 L78 280 Z" fill="#241A12"/>
    <!-- Center Grand Arch Cutout -->
    <path d="M146 222 Q190 204 234 222 L234 316 L146 316 Z" fill="#241A12"/>
    <!-- Right Jharokha (Window) Cutout -->
    <path d="M262 226 Q282 214 302 226 L302 280 L262 280 Z" fill="#241A12"/>

    <!-- Jharokha Lattice Details -->
    <circle cx="98" cy="246" r="6" fill="url(#goldGrad)"/>
    <circle cx="190" cy="252" r="10" fill="url(#goldGrad)"/>
    <circle cx="282" cy="246" r="6" fill="url(#goldGrad)"/>

    <!-- Plinth / Stepped Base -->
    <rect x="34" y="316" width="312" height="14" rx="3"/>
    <rect x="20" y="330" width="340" height="16" rx="4"/>
  </g>
</svg>